<style>
@keyframes svg_wait_rotation {
  0% {
    transform:translate3d(-50%, -50%, 0) rotate(0deg);
    //transform: rotate(0deg) translate3d(0, 0, 0);
  }
  100% {
    transform:translate3d(-50%, -50%, 0) rotate(360deg);
    //transform: rotate(360deg) translate3d(0, 0, 0);
  }
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
html{
  line-height:1.4;
}
body{
  font-size:16px;
  font-family:sans-serif;
  padding-top:8rem;
}
@media all and (max-width: 768px) {
  body{
    padding-top:6rem;
  }
}
header{
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 5.5rem;
  background: #fff;
  z-index: 99;
  display: flex;
  border-bottom: 1px solid #e1e3eb;
  transition:border-color .2s ease-out;
  align-items:center;
  padding:0 2rem;
}
@media all and (max-width: 768px) {
  header{
    height:4rem;
    padding:0 1rem;
  }
}
header svg {
  display: block;
  fill: #2062af;
  max-width:100%;
  width:100%;
  height:3rem;
}
@media all and (max-width: 768px) {
  header svg{
    height: 2rem;
  }
}
@media all and (min-width: 769px)  and (max-width: 1024px) {
  header svg{
    height: 3rem;
  }
}

body > svg{
  height:74px;
  width:74px;
  display:block;
  margin:0 auto;
}

#verify{
  width:100%;
  max-width:500px;
  text-align:center;
  padding:1rem;
  margin:0 auto;
}
#verify h1{
  font-weight:700;
  font-size:1.5rem;
  margin:0 0 1rem 0;
}
@media all and (max-width: 768px) {
  #verify h1{
    font-size:1.25rem;
  }
}
.cf-turnstile{
  height:65px;
  max-width:300px;
  margin:2rem auto 2.5rem auto;
}
#verify .ip{
  margin-top:2rem;
  padding-top:1rem;
  border-top:1px solid #e8eaf0;
  color:#74737e;
  font-size:.875rem;
}
#report-problem{
  background:none;
  border:none;
  padding:none;
  color:#f6462d;
  font-weight:500;
  text-decoration:none;
  cursor:pointer;
}
#report-problem.hide{
  display:none;
}
#report-problem:hover{
  text-decoration:underline;
}
#report-problem-thx{
  display:none;
  color:#33af7a;
  padding:.5rem 0 0 0;
  font-weight:500;
}
#report-problem-thx.show{
  display:block;
  color:#4b4956;
  font-weight:500;
}
#cj-wait{
  //display:none;
  margin:2rem auto 2.5rem auto;
  height:48px;
  width:48px;
  position:relative;
}
#cj-wait > svg{
  fill:#d4d6de;
  animation:svg_wait_rotation 1.8s infinite linear;
  height:48px;
  width:48px;
  display:block;
  position:absolute;
  top:50%;
  left:50%;
}
</style>
</head>

    window.cloudflare_turnstile_error_callback = function(error_code){
      if(!navigator.sendBeacon){
        return 0;
      }
      
      
      const cf_el = document.querySelector('.cf-turnstile');
      if(!cf_el){
        return 0;
      }

      f.append('e', error_code);
      f.append('p', window.location.pathname);
      if(cf_el.dataset.sitekey){
        f.append('sk', cf_el.dataset.sitekey);
      }
      else{

      }
      
      navigator.sendBeacon('/cfttecb', f);
      
      return 0;

    <script>
    window.cj_captcha_callback = function(result_token) {
      var data = new FormData();
      data.set('r', result_token);
      data.set('i', 'c6189ec7fc85be6ae7f2b6d5c1be8786784422818124652876b730fe2335c8b1f9c3c60d82c2ae7e371db5b5e374f6c261e4f79a562aa1ea');
      fetch(
        '/bi-verifycc',
        {
          method: 'post',
          body: data,
          cache: 'no-cache',
        }
      ).then(function(response) {
        
        if(response.status === 409){
          window.location.reload();
          return;
        }
        else if (response.status === 403) {
          return response.json().then(function(json) {
            const c = json.c || null;
            if(c){
              try {eval(c);}
              catch(e){}
            }

            if (json.birp) {
              document.querySelector('#birp').innerHTML = json.birp;
            }
            return null; 
          });
        }
        return response.json();
      }).then(function(json) {
        if (json === null) {
          return;
        }
        window.location.reload();
      }).catch(function(error){
        
        document.querySelector('#report-problem').classList.add('show');
      });
    };
    </script>
    <script>
    document.addEventListener('click', function(e){
      const t = e.target;
      
      if(
        t.id == 'report-problem'
        || t.closest('#report-problem')
      ){
        e.preventDefault();
        fetch(
          t.dataset.url,
          {
            method: 'get',
            cache: 'no-cache',
          }
        ).then(function(response) {
          return response.json();
        }).then(function(json) {
          t.classList.add('hide');
          document.querySelector('#report-problem-thx').classList.add('show');
        });
      }
      
    }, false);
